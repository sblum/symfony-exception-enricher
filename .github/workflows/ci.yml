name: GitHub Actions

on:
  pull_request:
  push:
    branches: [ master ]

jobs:
  phpunit:
    name: PHPUnit / php ${{ matrix.php-version }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: [ '8.3', '8.4' ]
        dependencies: [ 'locked' ]
        include:
          # The lock file pins Symfony 7; this job installs the newest versions (Symfony 8).
          - php-version: '8.4'
            dependencies: 'highest'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup php
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Get composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php-version }}-${{ matrix.dependencies }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php-version }}-${{ matrix.dependencies }}-composer-

      - name: Install locked dependencies
        if: matrix.dependencies == 'locked'
        run: composer install --quiet --no-interaction --prefer-dist --no-progress

      - name: Install highest dependencies
        if: matrix.dependencies == 'highest'
        run: composer update --quiet --no-interaction --prefer-dist --no-progress --prefer-stable

      - name: Show Symfony version
        run: composer show symfony/dependency-injection | grep -E '^versions'

      - name: Run tests
        run: vendor/bin/phpunit -v
